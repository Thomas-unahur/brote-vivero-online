  <path d="M230 272 L266 272 L253 346 Q252 350 248 350 L222 350 Z" fill="#E9E4D8"/>
  <path d="M134 272 L266 272 L265 280 L135 280 Z" fill="#E9E4D8"/>
  <path d="M230 272 L266 272 L265 280 L229 280 Z" fill="#D6CFBF"/>
